name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:pkg
      - name: Fuzz the transform on real packages
        if: matrix.node == 24
        run: pnpm fuzz
      - run: node dist/cli.mjs --version
      - name: Smoke-test the built package from CommonJS and ESM
        run: |
          node -e "const r = require('./dist/index.cjs').transform('console.log(1);x()'); if (r.code !== 'x()') throw new Error(r.code)"
          node --input-type=module -e "import { transform } from './dist/index.mjs'; const r = transform('console.log(1);x()'); if (r.code !== 'x()') throw new Error(r.code)"
          node -e "if (typeof require('./dist/webpack.cjs') !== 'function') throw new Error('bad webpack export')"
      - name: Smoke-test the CLI
        run: |
          cp -r test/fixtures/app "$RUNNER_TEMP/app"
          if node dist/cli.mjs audit "$RUNNER_TEMP/app"; then echo "audit should fail before stripping"; exit 1; fi
          node dist/cli.mjs "$RUNNER_TEMP/app"
          node dist/cli.mjs audit "$RUNNER_TEMP/app"
      - name: Check the CLI exits 2 on bad options
        run: |
          set +e
          node dist/cli.mjs audit "$RUNNER_TEMP/app" --metods log; test $? -eq 2 || exit 1
          echo '{"metods": ["log"]}' > "$RUNNER_TEMP/bad.json"
          node dist/cli.mjs audit "$RUNNER_TEMP/app" --config "$RUNNER_TEMP/bad.json"; test $? -eq 2 || exit 1
